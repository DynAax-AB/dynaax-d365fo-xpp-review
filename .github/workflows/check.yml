name: Check skills

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays: also check that Microsoft Learn links still open
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check skill files
        run: python3 tests/check_skills.py
      - name: Check links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 tests/check_skills.py --online
